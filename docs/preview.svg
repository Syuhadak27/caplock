<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-label="CapLock menu bar icon and HUD preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1621"/>
      <stop offset="100%" stop-color="#14232a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="840" height="240" rx="14" fill="url(#bg)"/>

  <!-- menu bar -->
  <rect x="0" y="0" width="840" height="34" fill="#1c2733" opacity="0.9"/>
  <text x="20" y="22" fill="#8e9aa8" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13">Finder</text>
  <text x="86" y="22" fill="#8e9aa8" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13">File</text>
  <text x="132" y="22" fill="#8e9aa8" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13">Edit</text>

  <!-- status item: keycap with A -->
  <g transform="translate(688,5)">
    <rect x="0" y="0" width="24" height="24" rx="5" fill="#ff3b30"/>
    <text x="12" y="16" text-anchor="middle" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold">A</text>
    <rect x="7.5" y="19" width="9" height="1.6" rx="0.8" fill="#ffffff"/>
  </g>
  <text x="722" y="22" fill="#c8d0da" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13">⌘</text>

  <!-- HUD near cursor -->
  <g transform="translate(250,86)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="76" rx="15" fill="#f7f8fa"/>
    <rect x="1" y="1" width="298" height="74" rx="14" fill="none" stroke="#ff3b30" stroke-width="2"/>
    <text x="150" y="33" text-anchor="middle" fill="#ff3b30" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">CAPS LOCK AKTIF</text>
    <text x="150" y="56" text-anchor="middle" fill="#8e8e93" font-family="Helvetica, Arial, sans-serif" font-size="12">Huruf besar aktif saat mengetik</text>
  </g>

  <!-- fake text caret -->
  <g transform="translate(556,120)">
    <rect x="0" y="-14" width="170" height="20" rx="4" fill="#22303d"/>
    <text x="9" y="0" fill="#d7dee7" font-family="Helvetica, Arial, sans-serif" font-size="13">Halo, ini contoh teks</text>
    <rect x="172" y="-15" width="2" height="22" fill="#ff3b30"/>
  </g>

  <text x="24" y="216" fill="#6f7f8f" font-family="Helvetica, Arial, sans-serif" font-size="12">Ikon di menu bar + HUD mengikuti posisi kursor saat mengetik</text>
</svg>
