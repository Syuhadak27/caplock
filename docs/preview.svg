<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" role="img" aria-label="CapLock menu bar icon and indicator above a focused text box">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1621"/>
      <stop offset="100%" stop-color="#14232a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="840" height="240" rx="14" fill="url(#bg)"/>

  <!-- menu bar -->
  <rect x="0" y="0" width="840" height="34" fill="#1c2733" opacity="0.9"/>
  <text x="20" y="22" fill="#8e9aa8" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13">Finder</text>
  <text x="86" y="22" fill="#8e9aa8" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13">File</text>
  <text x="132" y="22" fill="#8e9aa8" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13">Edit</text>

  <!-- status item: keycap with A -->
  <g transform="translate(688,5)">
    <rect x="0" y="0" width="24" height="24" rx="5" fill="#ff3b30"/>
    <text x="12" y="16" text-anchor="middle" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold">A</text>
    <rect x="7.5" y="19" width="9" height="1.6" rx="0.8" fill="#ffffff"/>
  </g>
  <text x="722" y="22" fill="#c8d0da" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13">⌘</text>

  <!-- mock app window -->
  <g transform="translate(180,62)" filter="url(#shadow)">
    <rect x="0" y="0" width="480" height="132" rx="12" fill="#f2f4f7"/>
    <rect x="0" y="0" width="480" height="28" rx="12" fill="#dfe4ea"/>
    <circle cx="16" cy="14" r="4" fill="#ff5f57"/>
    <circle cx="30" cy="14" r="4" fill="#febc2e"/>
    <circle cx="44" cy="14" r="4" fill="#28c840"/>

    <!-- focused text box -->
    <rect x="38" y="52" width="404" height="40" rx="6" fill="#ffffff" stroke="#b9c2cc" stroke-width="1.5"/>
    <text x="52" y="77" fill="#3c4652" font-family="Helvetica, Arial, sans-serif" font-size="14">Halo, ini contoh teks</text>
    <rect x="170" y="61" width="2" height="22" fill="#ff3b30"/>

    <!-- badge anchored above the text box -->
    <g transform="translate(168,10)">
      <path d="M76 27 L86 27 L81 33 Z" fill="#ff3b30"/>
      <rect x="0" y="0" width="168" height="28" rx="8" fill="#ff3b30"/>
      <rect x="6" y="6" width="16" height="16" rx="4" fill="#ffffff"/>
      <text x="14" y="18" text-anchor="middle" fill="#ff3b30" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">A</text>
      <text x="29" y="18" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">CAPS LOCK AKTIF</text>
    </g>
  </g>

  <text x="24" y="218" fill="#6f7f8f" font-family="Helvetica, Arial, sans-serif" font-size="12">Ikon di menu bar + indikator menempel tepat di atas text box yang sedang fokus</text>
</svg>
